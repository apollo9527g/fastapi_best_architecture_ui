name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/fastapi-practices/fastapi-best-architecture-ui.git
          git fetch upstream
          git checkout master
          git merge upstream/master --no-edit
          git push origin master
